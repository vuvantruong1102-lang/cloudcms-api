name = "cloudcms-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "cloudcms"
database_id = "00c2d270-b0af-474c-9a7a-2f4cfc86e40e"

# R2 Bucket for media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cloudcms-media"

# Workers AI (optional - cho tính năng AI gợi ý SEO)
[ai]
binding = "AI"

# Environment variables (non-secret)
[vars]
SITE_URL = "https://example.com"
R2_PUBLIC_URL = "https://pub-4f95703f5b2b434c906890b43ed7b7e7.r2.dev"
R2_ACCOUNT_ID = "1c4d476a777d00e37e8a366162acda5c"
R2_BUCKET = "cloudcms-media"
JWT_ISSUER = "cloudcms"

# Secrets (set via: wrangler secret put JWT_SECRET)
# - JWT_SECRET
# - OPENAI_API_KEY (nếu dùng OpenAI thay Workers AI)
